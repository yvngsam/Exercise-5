<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    
<style>
    body {
        font-family: Arial, sans-serif;
        font-size: 20px;
        max-width: 850px;
        margin: 40px auto;
        padding: 0 24px;
        line-height: 1.6;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 30px;
    }

    h2 {
        font-size: 26px;
        margin-top: 35px;
    }

    label {
        display: block;
        margin-bottom: 8px;
    }

    input,
    select {
        box-sizing: border-box;
        width: 100%;
        max-width: 420px;
        min-height: 52px;
        padding: 12px;
        font-size: 20px;
    }

    button {
        margin-top: 10px;
        padding: 15px 22px;
        font-size: 20px;
        cursor: pointer;
    }

    #quantity-error {
        color: #c62828;
        font-weight: bold;
    }

    #result {
        font-size: 24px;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        body {
            margin: 20px auto;
            padding: 0 16px;
            font-size: 18px;
        }

        h1 {
            font-size: 28px;
        }

        input,
        select,
        button {
            font-size: 18px;
        }

        button {
            width: 100%;
            min-height: 54px;
        }
    }
</style>
</head>
<body>

    <h1>Калькулятор стоимости заказа</h1>

    <form id="order-form" novalidate>
        <p>
            <label for="product">Выберите товар:</label>
            <select id="product" name="product" required>
                <option value="">-- Выберите товар --</option>
                <option value="notebook" data-price="50000">Ноутбук — 50000 руб.</option>
                <option value="mouse" data-price="1500">Мышь — 1500 руб.</option>
                <option value="keyboard" data-price="3000">Клавиатура — 3000 руб.</option>
                <option value="monitor" data-price="20000">Монитор — 20000 руб.</option>
            </select>
        </p>

        <p>
            <label for="quantity">Количество товара:</label>
            <input
                type="text"
                id="quantity"
                name="quantity"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Введите количество"
                required
                aria-describedby="quantity-error">
        </p>

        <p id="quantity-error" role="alert" hidden></p>

        <button type="submit">Рассчитать стоимость</button>
    </form>

    <h2>Результат расчёта</h2>
    <p id="result" role="status" aria-live="polite">
        Выберите товар и укажите количество.
    </p>

    <script>
        "use strict";

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("order-form");
            const product = document.getElementById("product");
            const quantity = document.getElementById("quantity");
            const quantityError = document.getElementById("quantity-error");
            const result = document.getElementById("result");

            const quantityPattern = /^[0-9]+$/;

            function showError(message) {
                quantityError.textContent = message;
                quantityError.hidden = false;
                result.textContent = "Не удалось рассчитать стоимость.";
            }

            function clearError() {
                quantityError.textContent = "";
                quantityError.hidden = true;
            }

            quantity.addEventListener("input", function () {
                clearError();
                result.textContent = "Нажмите кнопку для расчёта стоимости.";
            });

            product.addEventListener("change", function () {
                clearError();
                result.textContent = "Нажмите кнопку для расчёта стоимости.";
            });

            form.addEventListener("submit", function (event) {
                event.preventDefault();

                clearError();

                if (product.value === "") {
                    result.textContent = "Не удалось рассчитать стоимость.";
                    quantityError.textContent = "Пожалуйста, выберите товар.";
                    quantityError.hidden = false;
                    product.focus();
                    return;
                }

                const quantityValue = quantity.value.trim();

                if (quantityValue === "") {
                    showError("Введите количество товара.");
                    quantity.focus();
                    return;
                }

                if (!quantityPattern.test(quantityValue)) {
                    showError(
                        "Ошибка: количество должно содержать только цифры."
                    );
                    quantity.focus();
                    return;
                }

                const count = Number(quantityValue);

                if (!Number.isSafeInteger(count) || count <= 0) {
                    showError(
                        "Количество должно быть целым числом больше нуля."
                    );
                    quantity.focus();
                    return;
                }

                const selectedOption = product.options[product.selectedIndex];
                const price = Number(selectedOption.dataset.price);

                if (!Number.isFinite(price) || price <= 0) {
                    showError("Не удалось определить цену выбранного товара.");
                    product.focus();
                    return;
                }

                const total = price * count;

                if (!Number.isSafeInteger(total)) {
                    showError("Слишком большое количество товара.");
                    quantity.focus();
                    return;
                }

                result.textContent =
                    "Стоимость заказа: " +
                    total.toLocaleString("ru-RU") +
                    " руб.";
            });
        });
    </script>

</body>
</html>
